<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM SHRI School Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            max-width: 80%;
            clear: both;
        }

        .message.user {
            margin-left: auto;
            text-align: right;
        }

        .message.bot {
            margin-right: auto;
        }

        .message-bubble {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px;
            position: relative;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.bot .message-bubble {
            background: white;
            border: 1px solid #e9ecef;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }

        .message.user .message-time {
            text-align: left;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.25);
        }

        .chat-input button {
            margin-left: 10px;
            padding: 0 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 10px 20px;
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #667eea;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        .welcome-message {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .welcome-message h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .suggestion {
            background: #e3f2fd;
            color: #1976d2;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .suggestion:hover {
            background: #bbdefb;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .chat-container {
                margin: 10px;
                border-radius: 15px;
            }

            .chat-header h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>PM SHRI School Helper</h1>
            <p>Your AI assistant for school information</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2>Hello! 👋</h2>
                <p>I'm your helpful assistant for PM SHRI Government Senior Secondary School, Mandal, Bhilwara. Ask me about admissions, academics, facilities, or any other school-related questions!</p>
                <div class="suggestions">
                    <div class="suggestion" onclick="askQuestion('What are the admission procedures?')">Admissions</div>
                    <div class="suggestion" onclick="askQuestion('What streams are offered?')">Academics</div>
                    <div class="suggestion" onclick="askQuestion('What facilities are available?')">Facilities</div>
                    <div class="suggestion" onclick="askQuestion('What are the school timings?')">Timings</div>
                </div>
            </div>
        </div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Ask me anything about the school..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Knowledge base from our school website
        const knowledgeBase = {
            admissions: {
                keywords: ['admission', 'apply', 'enroll', 'registration', 'form', 'procedure', 'process', 'eligibility', 'requirement', 'documents', 'entrance test'],
                responses: [
                    "Admission procedures vary by grade level. You can obtain application forms from our website or school office (9:00 AM - 4:00 PM on working days). The process involves: 1) Obtaining application form, 2) Filling it accurately with required documents, 3) Submitting before deadline, 4) Appearing for entrance test and student-parent interaction, 5) Checking results and completing admission formalities if selected.",
                    "For admission inquiries, please contact our admissions office at +91 9352599991 (9:00 AM - 5:00 PM) or email ghss_mandal@rediffmail.com. Required documents typically include mark sheets, birth certificate, transfer certificate, character certificate, photographs, and Aadhaar card copy."
                ]
            },
            academics: {
                keywords: ['academic', 'study', 'class', 'subject', 'stream', 'syllabus', 'curriculum', 'exam', 'result', 'grade', 'standard'],
                responses: [
                    "We offer three streams at the senior secondary level: Science (Physics, Chemistry, Biology/Mathematics), Commerce (Accountancy, Business Studies, Economics), and Arts/Humanities (History, Geography, Political Science, Sociology, Psychology, Economics). Students can choose based on their interests and Class 10 performance.",
                    "Our school maintains a 98% pass rate with 50+ dedicated faculty members. We focus on academic excellence while promoting holistic development through sports, arts, and community service. We have smart classrooms, modern laboratories, and a well-stocked library to support learning."
                ]
            },
            facilities: {
                keywords: ['facility', 'facilities', 'infrastructure', 'lab', 'laboratory', 'library', 'sports', 'playground', 'classroom', 'transport', 'bus'],
                responses: [
                    "Our school boasts state-of-the-art infrastructure including smart classrooms, modern science and computer laboratories, a well-stocked library, extensive playgrounds, and dedicated spaces for arts and music. We provide excellent sports facilities for athletics, football, cricket, kho-kho and more, with over 30 sports and clubs available.",
                    "Transportation facilities are available with bus services covering various routes in Mandal and surrounding areas. For specific route information, timings, and fees, please contact the school office."
                ]
            },
            timings: {
                keywords: ['time', 'timing', 'schedule', 'hour', 'open', 'close', 'when', 'office hours'],
                responses: [
                    "School timings are from 8:00 AM to 2:00 PM for all grade levels. Office hours are Monday-Friday: 8:00 AM - 4:00 PM, Saturday: 9:00 AM - 1:00 PM (for inquiries only), and Sunday & Public Holidays: Closed.",
                    "The academic day runs from 8:00 AM to 2:00 PM with appropriate breaks. Administrative offices operate during the hours mentioned above for admissions, inquiries, and other official work."
                ]
            },
            contact: {
                keywords: ['contact', 'phone', 'email', 'address', 'location', 'reach', 'call', 'message'],
                responses: [
                    "You can reach us at: Phone: +91 9352599991, Email: ghss_mandal@rediffmail.com, Address: Mandal, Bhilwara, Rajasthan - 311403, India. Our office hours are Monday-Friday: 8:00 AM - 4:00 PM, Saturday: 9:00 AM - 1:00 PM (inquiries only).",
                    "For admissions inquiries specifically, contact: +91 9352599991 (9:00 AM - 5:00 PM) or ghss_mandal@rediffmail.com. We're also active on social media: Facebook, Twitter/X, and Instagram (@pmshrimandal)."
                ]
            },
            vision: {
                keywords: ['vision', 'mission', 'goal', 'aim', 'objective', 'purpose'],
                responses: [
                    "Our vision is to empower every student with knowledge, skills, and values to become responsible global citizens and leaders of tomorrow. Our mission is to provide quality education that fosters intellectual growth, creativity, and character development in a nurturing and inclusive environment.",
                    "We strive for excellence in academics while promoting holistic development through sports, arts, and community service. Our core values are Excellence, Integrity, Respect, Innovation, and Service."
                ]
            },
            achievements: {
                keywords: ['achievement', 'award', 'recognition', 'accomplishment', 'success', 'award', 'prize'],
                responses: [
                    "Our school has achieved excellence in multiple areas: Academic excellence (consistent top performers in board examinations), Sports championships (district and state level wins in athletics, football, cricket, kho-kho), Cultural triumphs (regional and national level competitions in arts, music, dance), and Community service (social welfare initiatives, environmental campaigns, rural outreach programs).",
                    "We take pride in our 98% pass rate and the holistic development of our 1000+ students through our comprehensive educational approach."
                ]
            },
            values: {
                keywords: ['value', 'principle', 'ethic', 'moral', 'character', 'discipline'],
                responses: [
                    "Our core values are Excellence (striving for highest standards), Integrity (upholding honesty and ethics), Respect (valuing diversity and dignity), Innovation (embracing creativity and progressive thinking), and Service (committing to positive societal contribution). These values guide our educational approach and student development programs.",
                    "We believe in nurturing not just academic excellence but also character building, preparing students to become responsible global citizens who contribute positively to society."
                ]
            }
        };

        // Default responses for unrecognized queries
        const defaultResponses = [
            "I'm here to help you with information about PM SHRI Government Senior Secondary School, Mandal, Bhilwara. You can ask me about admissions, academics, facilities, timings, contact information, vision, achievements, or values.",
            "I specialize in providing information about our school. Try asking about admission procedures, academic streams, school facilities, timings, or how to contact us.",
            "For specific information about our school's programs, facilities, or admission process, please feel free to ask! I'm here to help you get the information you need."
        ];

        // DOM elements
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.querySelector('.chat-input button');

        // Initialize chat
        function initChat() {
            // Add welcome message if not already present
            if (!chatMessages.querySelector('.welcome-message')) {
                addMessage("Hello! 👋 I'm your helpful assistant for PM SHRI Government Senior Secondary School, Mandal, Bhilwara. Ask me about admissions, academics, facilities, or any other school-related questions!", 'bot');

                // Add suggestion chips
                const suggestionsDiv = document.createElement('div');
                suggestionsDiv.className = 'suggestions';
                suggestionsDiv.innerHTML = `
                    <div class="suggestion" onclick="askQuestion('What are the admission procedures?')">Admissions</div>
                    <div class="suggestion" onclick="askQuestion('What streams are offered?')">Academics</div>
                    <div class="suggestion" onclick="askQuestion('What facilities are available?')">Facilities</div>
                    <div class="suggestion" onclick="askQuestion('What are the school timings?')">Timings</div>
                `;
                chatMessages.appendChild(suggestionsDiv);
            }

            // Scroll to bottom
            scrollToBottom();
        }

        // Send message when button clicked
        function sendMessage() {
            const message = userInput.value.trim();
            if (message) {
                addMessage(message, 'user');
                userInput.value = '';
                setTimeout(() => {
                    botResponse(message);
                }, 500);
            }
        }

        // Send message when Enter key pressed
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Add message to chat
        function addMessage(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.textContent = content;

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            messageDiv.appendChild(bubbleDiv);
            messageDiv.appendChild(timeDiv);
            chatMessages.appendChild(messageDiv);

            scrollToBottom();
        }

        // Bot response logic
        function botResponse(userMessage) {
            // Show typing indicator
            showTypingIndicator();

            setTimeout(() => {
                hideTypingIndicator();

                // Process the message and get response
                const response = getResponse(userMessage.toLowerCase());
                addMessage(response, 'bot');
            }, 1000 + Math.random() * 1000); // Random delay between 1-2 seconds
        }

        // Show typing indicator
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            typingDiv.id = 'typingIndicator';
            chatMessages.appendChild(typingDiv);
            scrollToBottom();
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            const typingDiv = document.getElementById('typingIndicator');
            if (typingDiv) {
                typingDiv.remove();
            }
        }

        // Get response based on keywords
        function getResponse(message) {
            // Check each category for matching keywords
            for (const [category, data] of Object.entries(knowledgeBase)) {
                const keywordMatch = data.keywords.some(keyword =>
                    message.includes(keyword)
                );

                if (keywordMatch) {
                    // Return random response from matching category
                    const responses = data.responses;
                    return responses[Math.floor(Math.random() * responses.length)];
                }
            }

            // Return default response if no match found
            return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
        }

        // Helper function to ask a question (used by suggestion chips)
        function askQuestion(question) {
            userInput.value = question;
            sendMessage();
        }

        // Scroll to bottom of chat
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Initialize chat when page loads
        document.addEventListener('DOMContentLoaded', initChat);
    </script>
</body>
</html>
